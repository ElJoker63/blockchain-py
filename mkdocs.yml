site_name: blockchain-api
site_description: Async Python client for the Blockchain.com Explorer API
site_author: ElJoker63
site_url: https://eljoker63.github.io/blockchain-py/
repo_url: https://github.com/ElJoker63/blockchain-py
repo_name: ElJoker63/blockchain-py

theme:
  name: material
  language: es
  palette:
    # Modo Claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Cambiar al modo oscuro
    # Modo Oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar al modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

copyright: 'Desarrollado con ❤️ por ElJoker63. &lt;☕&gt;+☕️=❤️'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ElJoker63/blockchain-py
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/blockchain-api/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Instalación: installation.md
  - Inicio Rápido: quickstart.md
  - API:
      - Cliente: api/client.md
      - Blockchain Data: api/blockchain.md
      - Simple Query: api/simple-query.md
      - Exchange Rates: api/exchange-rates.md
      - Charts: api/charts.md
      - WebSocket: api/websocket.md
  - Tipos de Datos: types.md
  - Ejemplos: examples.md
